name: Make video

on:
  workflow_dispatch:
    inputs:
      story:
        description: "Paste the story"
        required: true
      minutes:
        description: "Length in minutes (e.g. 1, 1.5, 2)"
        default: "1.5"
      style:
        description: "Art style"
        type: choice
        options: [dark-cartoon, bright-cartoon, storybook]
        default: dark-cartoon
      voice:
        description: "Narrator voice"
        type: choice
        options: [young-narrator, deep-narrator, british-narrator, female-narrator]
        default: young-narrator
      formats:
        description: "Formats"
        type: choice
        options: [vertical, horizontal, "vertical,horizontal"]
        default: "vertical,horizontal"
      job_id:
        description: "Job name (re-use the same name to continue a job that stopped)"
        required: false

permissions:
  contents: read

concurrency: { group: "video-${{ inputs.job_id || github.run_id }}", cancel-in-progress: false }

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      KOKORO_DIR: ${{ github.workspace }}/.kokoro
      CAPTION_FONT: /usr/share/fonts/opentype/inter/Inter-Black.otf
      JOB: ${{ inputs.job_id || format('run-{0}', github.run_id) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-inter >/dev/null
          pip install -q -r requirements.txt
      - name: Voice model cache
        uses: actions/cache@v4
        with: { path: .kokoro, key: kokoro-v1.0 }
      - name: Restore unfinished job
        uses: actions/cache/restore@v4
        with:
          path: jobs/${{ env.JOB }}
          key: job-${{ env.JOB }}-${{ github.run_id }}
          restore-keys: job-${{ env.JOB }}-
      - name: Make video
        id: make
        env: { STORY: "${{ inputs.story }}" }
        run: |
          mkdir -p "jobs/$JOB"
          [ -f "jobs/$JOB/story.txt" ] || printf '%s' "$STORY" > "jobs/$JOB/story.txt"
          python -m engine.make_video "jobs/$JOB/story.txt" --out "jobs/$JOB" \
            --minutes "${{ inputs.minutes }}" --style "${{ inputs.style }}" --voice "${{ inputs.voice }}" \
            --formats "${{ inputs.formats }}"
      - name: Save job progress (so a re-run continues instead of paying again)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: jobs/${{ env.JOB }}
          key: job-${{ env.JOB }}-${{ github.run_id }}
      - name: Upload video
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.JOB }}
          path: |
            jobs/${{ env.JOB }}/*.mp4
            jobs/${{ env.JOB }}/plan.json
            jobs/${{ env.JOB }}/images/cast_*.png
          retention-days: 30
